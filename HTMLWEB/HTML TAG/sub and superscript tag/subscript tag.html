<!DOCTYPE html>
<html lang="en">

<head>
    <title>CODE WITH DEVIL</title>
</head>

<body>
    <h2> NOT APPLYING SUBSCRIPT</h2>
    <p>
        H2SO4 + 2NAOH => NA2SO4 + 2H2O
    </p>
    <hr>
    <h2> AFTER APPLYING SUBSCRIPT TAG</h2>
    <p>
        H <sub>2</sub>SO <sub>4</sub> + 2NaOH => Na <sub>2</sub>SO<sub>4</sub> +2H <sub>2</sub>O
    </p>
</body>

</html>
