<!DOCTYPE html>
<html lang="en">

<head>
    <title>CODE WITH DEVIL</title>
</head>

<body>
    <h2> NOT APPLYING SUPERSCRIPT </h2>
    <p>
        (a+b)2 => a2 + b2 + 2ab
    </p>
    <hr>
    <h2> after applying SUPERSCRIPT </h2>
    <p>
        (a+b)<sup>2</sup> => a <sup>2</sup> + b<sup>2</sup> +2ab
    </p>
</body>

</html>
